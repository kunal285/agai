[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dentistry-screening"
version = "0.1.0"
description = "Educational agentic AI dental X-ray screening research prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "PyYAML>=6", "pandas>=2", "scikit-learn>=1.3", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
models = ["torch>=2.2", "torchvision>=0.17", "ultralytics>=8.2"]
app = ["streamlit>=1.35", "matplotlib>=3.8"]
test = ["pytest>=8"]
all = ["torch>=2.2", "torchvision>=0.17", "ultralytics>=8.2", "streamlit>=1.35", "matplotlib>=3.8", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["dentistry*"]

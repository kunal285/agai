[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dentistry-screening"
version = "0.2.0"
description = "Advanced Agentic AI-Assisted Dental X-ray Screening Research Prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "opencv-python-headless>=4.8.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.12.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
models = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics>=8.2.0",
    "timm>=0.9.0",
    "pytorch-grad-cam>=0.2.1"
]
app = [
    "streamlit>=1.35.0"
]
test = [
    "pytest>=8.0.0"
]
all = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics>=8.2.0",
    "timm>=0.9.0",
    "pytorch-grad-cam>=0.2.1",
    "streamlit>=1.35.0",
    "pytest>=8.0.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.9.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["dentistry*"]
